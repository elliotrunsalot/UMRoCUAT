<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="squircle">
      <rect x="6" y="6" width="244" height="244" rx="48" ry="48" />
    </clipPath>
    <filter id="badge-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#07080d" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Modern Squircle Background with Signature Diagonal Tri-Colour Bands -->
  <g clip-path="url(#squircle)">
    <!-- Center Diagonal Band: Electric Blue -->
    <rect x="0" y="0" width="256" height="256" fill="#009CDE" />

    <!-- Bottom-Left Band: Electric Pink -->
    <polygon points="0,34 222,256 0,256" fill="#FF3EB5" />

    <!-- Top-Right Band: Vivid Yellow -->
    <polygon points="54,0 256,0 256,202" fill="#FEDD00" />

    <!-- Bold Diagonal Ink Dividers for Modern Graphic Contrast -->
    <line x1="-10" y1="24" x2="232" y2="266" stroke="#07080d" stroke-width="8" />
    <line x1="44" y1="-10" x2="266" y2="212" stroke="#07080d" stroke-width="8" />

    <!-- Subtle Top Gloss Highlight -->
    <ellipse cx="128" cy="14" rx="110" ry="26" fill="#FFFFFF" fill-opacity="0.18" />
  </g>

  <!-- Outer High-Contrast Ink Border -->
  <rect x="6" y="6" width="244" height="244" rx="48" ry="48" fill="none" stroke="#07080d" stroke-width="12" />

  <!-- ═══════════════════════════════════════════════════════════════════
       PURE VECTOR "UM" (TOP) + "RoC" (BOTTOM)
       Heavy #07080d outer stroke + hard shadow gives 21:1 contrast at 16x16
       ═══════════════════════════════════════════════════════════════════ -->
  <g filter="url(#badge-shadow)" stroke="#07080d" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">

    <!-- "U" (Top-Left, Crisp White with Heavy Ink Casing) -->
    <path fill="#FFFFFF" stroke-width="20"
          d="M 28,32 H 58 V 94 C 58,105 64,111 73,111 C 82,111 88,105 88,94 V 32 H 118 V 95 C 118,122 99,138 73,138 C 47,138 28,122 28,95 Z" />

    <!-- "M" (Top-Right, Vivid Yellow with Heavy Ink Casing) -->
    <path fill="#FEDD00" stroke-width="20"
          d="M 132,136 V 32 H 161 L 181,78 L 201,32 H 230 V 136 H 203 V 80 L 187,115 H 175 L 159,80 V 136 Z" />

    <!-- "R" (Bottom-Left) -->
    <path fill="#FFFFFF" stroke-width="18" fill-rule="evenodd"
          d="M 28,226 V 154 H 68 C 84,154 94,162 94,176 C 94,186 88,193 79,196 L 96,226 H 72 L 58,199 H 50 V 226 Z
             M 50,170 V 184 H 65 C 70,184 73,181 73,177 C 73,173 70,170 65,170 Z" />

    <!-- "o" (Bottom-Center) -->
    <path fill="#FEDD00" stroke-width="18" fill-rule="evenodd"
          d="M 130,162 C 149,162 162,175 162,194 C 162,213 149,227 130,227 C 111,227 98,213 98,194 C 98,175 111,162 130,162 Z
             M 130,180 C 122,180 118,186 118,194 C 118,202 122,209 130,209 C 138,209 142,202 142,194 C 142,186 138,180 130,180 Z" />

    <!-- "C" (Bottom-Right) -->
    <path fill="#FFFFFF" stroke-width="18"
          d="M 229,179 L 209,184 C 207,176 202,172 195,172 C 185,172 180,180 180,190 C 180,201 185,208 195,208 C 202,208 207,204 210,196 L 230,202 C 225,218 212,227 194,227 C 171,227 157,212 157,190 C 157,168 171,153 194,153 C 212,153 225,162 229,179 Z" />
  </g>
</svg>
