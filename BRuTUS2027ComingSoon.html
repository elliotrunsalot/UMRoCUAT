        rel="stylesheet">

    <style>
        html,
        body.coming-soon-page {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            max-height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            background-color: #f4f2ee;
            background-image:
                radial-gradient(ellipse 90% 45% at 14% 16%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 68%),
                radial-gradient(ellipse 75% 40% at 86% 22%, rgba(198, 205, 216, 0.52) 0%, rgba(198, 205, 216, 0) 70%),
                radial-gradient(ellipse 85% 50% at 52% 48%, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0) 65%),
                radial-gradient(ellipse 70% 42% at 22% 78%, rgba(212, 206, 198, 0.58) 0%, rgba(212, 206, 198, 0) 72%),
                radial-gradient(ellipse 80% 48% at 82% 84%, rgba(192, 200, 212, 0.46) 0%, rgba(192, 200, 212, 0) 70%),
                linear-gradient(124deg,
                    rgba(255, 255, 255, 0.7) 0%,
                    rgba(218, 222, 229, 0.42) 24%,
                    rgba(252, 251, 249, 0.85) 43%,
                    rgba(196, 203, 214, 0.36) 61%,
                    rgba(248, 246, 242, 0.88) 79%,
                    rgba(214, 209, 202, 0.45) 100%),
                linear-gradient(34deg,
                    #ebe8e2 0%,
                    #fbfaf8 28%,
                    #dfe3ea 52%,
                    #f9f8f5 76%,
                    #e7e4dd 100%);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-attachment: fixed;
        }

        body.coming-soon-page {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Subtle Roman White Marble Tonal Variation Overlay matching BRuTUS_course.html */
        body.coming-soon-page::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 65% 32% at 28% 34%, rgba(188, 196, 208, 0.26) 0%, transparent 70%),
                radial-gradient(ellipse 60% 35% at 74% 62%, rgba(208, 201, 192, 0.28) 0%, transparent 72%),
                linear-gradient(156deg,
                    transparent 0%,
                    rgba(184, 192, 204, 0.18) 32%,
                    rgba(255, 255, 255, 0.5) 48%,
                    rgba(202, 196, 188, 0.2) 67%,
                    transparent 100%);
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 0;
        }

        /* Top Navigation sitting directly on the marble background */
        .coming-soon-page .navparent {
            position: relative;
            z-index: 10;
            flex: 0 0 auto;
            width: 100%;
            margin: 0;
            padding: 1.15rem 1.5rem 0.4rem;
        }

        /* Frameless main stage filling remaining viewport height */
        .coming-soon-stage {
            position: relative;
            z-index: 1;
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            padding: 0.5rem 1.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        body.brutus-marble-page h1.coming-soon-title {
            flex: 0 0 auto;
            font-family: 'MuseoModerno', cursive, sans-serif;
            font-size: clamp(2rem, 5.2vw, 4.1rem);
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #f8f6f0;
            text-shadow: 3px 3px 0 #dc143c, 0 4px 12px rgba(176, 16, 48, 0.45);
            line-height: 1.06;
            margin: 0;
        }

        .coming-soon-subtitle {
            flex: 0 0 auto;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(0.9rem, 1.85vw, 1.32rem);
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--senate-crimson-deep);
            margin: 0.45rem 0 0.5rem 0;
            width: 100%;
            max-width: 760px;
            box-sizing: border-box;
            padding: 0 0.25rem;
            line-height: 1.3;
            white-space: normal;
            overflow-wrap: break-word;
            text-shadow: none;
        }

        .caesar-stencil-wrap {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: transparent;
        }

        .caesar-stencil-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            aspect-ratio: 1 / 1;
            display: block;
            object-fit: cover;
            border-radius: 50%;
            background: transparent;
            -webkit-mask-image: radial-gradient(circle closest-side, #000 82%, rgba(0, 0, 0, 0.55) 91%, transparent 100%);
            mask-image: radial-gradient(circle closest-side, #000 82%, rgba(0, 0, 0, 0.55) 91%, transparent 100%);
        }

        .coming-soon-quote {
            flex: 0 0 auto;
            font-family: 'Space Grotesk', 'Poppins', sans-serif;
            font-size: clamp(1.05rem, 1.9vw, 1.3rem);
            font-style: italic;
            font-weight: 600;
            letter-spacing: 0.4px;
            color: var(--marble-ink);
            margin: 0.5rem 0 0 0;
        }

        @media (max-width: 768px) {
            .coming-soon-page .navparent {
                padding: 0;
            }

            .coming-soon-stage {
                padding: 3.75rem 1rem 1.25rem;
            }

            .coming-soon-title {
                letter-spacing: 2px;
            }

            .coming-soon-subtitle {
                margin: 0.35rem 0 0.4rem 0;
                letter-spacing: 1px;
            }

            .caesar-stencil-wrap {
                max-width: 340px;
            }
        }
    </style>
</head>

<body class="brutus-marble-page theme-brutus coming-soon-page">

    <!-- Frameless Main Content -->
    <main class="coming-soon-stage">
        <h1 class="coming-soon-title">BRuTUS 2027</h1>
