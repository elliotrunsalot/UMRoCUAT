            function buildTrailModel(rawPoints) {
                let minLat = Infinity, maxLat = -Infinity;
                let minLon = Infinity, maxLon = -Infinity;
                let minEle = Infinity, maxEle = -Infinity;

                for (let i = 0; i < rawPoints.length; i++) {
                    const [lat, lon, ele] = rawPoints[i];
                    if (lat < minLat) minLat = lat;
                    if (lat > maxLat) maxLat = lat;
                    if (lon < minLon) minLon = lon;
                    if (lon > maxLon) maxLon = lon;
                    if (ele < minEle) minEle = ele;
                    if (ele > maxEle) maxEle = ele;
                }

                const centerLat = (minLat + maxLat) / 2;
                const centerLon = (minLon + maxLon) / 2;
                const latSpan = (maxLat - minLat) || 0.25;
                const lonSpan = (maxLon - minLon) || 0.20;
                const maxSpan = Math.max(latSpan, lonSpan);
                const eleSpan = Math.max(100, maxEle - minEle);

                const toModel = (lat, lon, ele) => {
                    // X: West -> East, Z: North -> South, Y: Elevation above Canberra base plane
                    const x = ((lon - centerLon) / maxSpan) * 2.38;
                    const z = (-(lat - centerLat) / maxSpan) * 2.38;
                    const y = ((ele - minEle) / eleSpan) * 0.38;
                    return { x, y, z, lat, lon, ele };
                };

                    const a = (i / 32) * Math.PI * 2;
                    stateCircleRing.push(
                        toStencilPlane(
                            LANDMARKS.parliament.lat + Math.sin(a) * 0.0068,
                            LANDMARKS.parliament.lon + Math.cos(a) * 0.0082
                        )
                    );
                    capitalCircleRing.push(
                        toStencilPlane(
                            LANDMARKS.parliament.lat + Math.sin(a) * 0.0034,
                            LANDMARKS.parliament.lon + Math.cos(a) * 0.0041
                        )
                    );
                    cityHillRing.push(
                        toStencilPlane(
                            LANDMARKS.civic.lat + Math.sin(a) * 0.0032,
                            LANDMARKS.civic.lon + Math.cos(a) * 0.0038
                        )
                    );
                }

                // Match each of the 6 High Point targets to its closest GPX node
                peakIndices = HIGH_POINT_TARGETS.map((target) => {
                    let bestIdx = 0;
                    let bestDist = Infinity;
                    for (let i = 0; i < trailNodes.length; i++) {
                        const dLat = trailNodes[i].lat - target.lat;
                        const dLon = trailNodes[i].lon - target.lon;
                        const d = dLat * dLat + dLon * dLon;
                        if (d < bestDist) {
                            bestDist = d;
                            bestIdx = i;
                        }
                    }
                    return bestIdx;
                });
            }

            // Initialize immediately with embedded Centenary Trail points
            buildTrailModel(FALLBACK_GPX_POINTS);

            // Also load full high-resolution CanberraCentenaryTrail.gpx when served over HTTP/HTTPS
            fetch('CanberraCentenaryTrail.gpx')
                .then((res) => (res.ok ? res.text() : Promise.reject()))
                .then((xmlText) => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(xmlText, 'application/xml');
                    const trkpts = xml.querySelectorAll('trkpt');
                    if (trkpts && trkpts.length > 100) {
                        const cleanSampled = [];
                        const step = Math.max(1, Math.floor(trkpts.length / 360));
                        for (let i = 0; i < trkpts.length; i += step) {
                            const pt = trkpts[i];
                            const lat = parseFloat(pt.getAttribute('lat'));
                            const lon = parseFloat(pt.getAttribute('lon'));
                            const eleNode = pt.querySelector('ele');
                            const ele = eleNode ? parseFloat(eleNode.textContent) : 600;
                            if (!isNaN(lat) && !isNaN(lon)) {
                                cleanSampled.push([lat, lon, ele]);
                            }
                        }
                        if (cleanSampled.length > 80) {
                            buildTrailModel(cleanSampled);
                        }
                    }
                })
                .catch(() => {
                    // Embedded fallback already active
                });

            /* ═══════════════════════════════════════════════════════════════════
               4. 3D PROJECTION & CANVAS RESIZE (SIZED TO FILL MOST OF SCREEN)
               ═══════════════════════════════════════════════════════════════════ */
            let viewW = 800;
            let viewH = 600;

            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                viewW = Math.max(280, rect.width);
                viewH = Math.max(280, rect.height);
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = viewW * dpr;
                canvas.height = viewH * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function project3D(x, y, z) {
                const cosY = Math.cos(yaw);
                const sinY = Math.sin(yaw);
                const rx = x * cosY - z * sinY;
                const rz = x * sinY + z * cosY;

                const cosP = Math.cos(pitch);
                const sinP = Math.sin(pitch);
                const ry = y * cosP - rz * sinP;
                const depth = y * sinP + rz * cosP;

                // On large screens (>640px), keep the exact original projection; on small screens, fill the dedicated canvas area beneath the top nav
                const isSmallScreen = window.innerWidth <= 640;
                const headerOffset = isSmallScreen ? 0 : 110;
                const effectiveH = Math.max(260, viewH - headerOffset);
                const baseSpan = isSmallScreen
                    ? Math.min(viewW * 0.96, effectiveH * 0.96)
                    : Math.min(viewW * 0.88, effectiveH * 0.94);
                const fov = baseSpan * (isSmallScreen ? 0.92 : 0.82) * zoom;
                const camDist = 2.95;
                const perspective = fov / Math.max(0.8, camDist + depth);

                return {
                    sx: viewW * 0.5 + rx * perspective,
                    sy: headerOffset + effectiveH * (isSmallScreen ? 0.51 : 0.54) - ry * perspective,
                    scale: perspective / 280,
                    depth
                };
            }

            function sampleLoopNode(progress) {
                if (!trailNodes.length) return { x: 0, y: 0, z: 0, ele: 600 };
                const wrapped = ((progress % 1) + 1) % 1;
                const exact = wrapped * (trailNodes.length - 1);
                const i0 = Math.floor(exact);
                const i1 = (i0 + 1) % trailNodes.length;
                const t = exact - i0;
                const a = trailNodes[i0];
                const b = trailNodes[i1];
                return {
                    x: a.x + (b.x - a.x) * t,
                    y: a.y + (b.y - a.y) * t,
                    z: a.z + (b.z - a.z) * t,
                    ele: a.ele + (b.ele - a.ele) * t
                };
            }

            /* ═══════════════════════════════════════════════════════════════════
               5. DIRECTION TOGGLE BUTTONS & POINTER DRAG / ZOOM INTERACTION
               ═══════════════════════════════════════════════════════════════════ */
            const btnFlipSpin = document.getElementById('btn-flip-spin');
            const spinDirIcon = document.getElementById('spin-dir-icon');
            const btnFlipRunner = document.getElementById('btn-flip-runner');
            const runnerDirIcon = document.getElementById('runner-dir-icon');

            btnFlipSpin.addEventListener('click', () => {
                spinDir *= -1;
                btnFlipSpin.classList.toggle('reversed', spinDir < 0);
                spinDirIcon.textContent = spinDir > 0 ? '🔄' : '🔃';
            });

            btnFlipRunner.addEventListener('click', () => {
                runnerDir *= -1;
                btnFlipRunner.classList.toggle('reversed', runnerDir < 0);
                runnerDirIcon.textContent = runnerDir > 0 ? '🏃⇄' : '⇄🏃';
            });

            canvas.addEventListener('pointerdown', (e) => {
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                canvas.setPointerCapture(e.pointerId);
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;
                yaw += dx * 0.007;
                pitch = Math.max(0.32, Math.min(1.22, pitch + dy * 0.006));
                dragStartX = e.clientX;
                dragStartY = e.clientY;
            });

            canvas.addEventListener('pointerup', () => {
                isDragging = false;
            });

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                zoom = Math.max(0.75, Math.min(1.55, zoom - e.deltaY * 0.0008));
            }, { passive: false });

            /* ═══════════════════════════════════════════════════════════════════
               6. STENCIL DRAWING HELPERS
               ═══════════════════════════════════════════════════════════════════ */
            function drawProjectedPolygon(nodes, fillStyle, strokeStyle, lineWidth) {
                if (!nodes || nodes.length < 3) return;
                ctx.save();
                ctx.beginPath();
                nodes.forEach((pt, idx) => {
                    const p = project3D(pt.x, 0, pt.z);
                    if (idx === 0) ctx.moveTo(p.sx, p.sy);
                    else ctx.lineTo(p.sx, p.sy);
                });
                ctx.closePath();
                if (fillStyle) {
                    ctx.fillStyle = fillStyle;
                    ctx.fill();
                }
                if (strokeStyle) {
                    ctx.strokeStyle = strokeStyle;
                    ctx.lineWidth = lineWidth || 1.5;
                    ctx.stroke();
                }
                ctx.restore();
            }

            function drawProjectedPolyline(nodes, strokeStyle, lineWidth, dash) {
                if (!nodes || nodes.length < 2) return;
                ctx.save();
                if (dash) ctx.setLineDash(dash);
                ctx.beginPath();
                nodes.forEach((pt, idx) => {
                    const p = project3D(pt.x, 0, pt.z);
                    if (idx === 0) ctx.moveTo(p.sx, p.sy);
                    else ctx.lineTo(p.sx, p.sy);
                });
                ctx.strokeStyle = strokeStyle;
                ctx.lineWidth = lineWidth || 1.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                ctx.restore();
            }

            function drawStencilPillLabel(text, sx, sy, opts = {}) {
                ctx.save();
                ctx.font = opts.font || '700 10px "Audiowide", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const metrics = ctx.measureText(text);
                const padX = opts.padX || 6;
                const padY = opts.padY || 3;
                const w = metrics.width + padX * 2;
                const h = (opts.height || 14) + padY * 2;

                if (opts.bg) {
                    ctx.fillStyle = opts.bg;
                    ctx.beginPath();
                    ctx.roundRect(sx - w / 2, sy - h / 2, w, h, 4);
                    ctx.fill();
                }
                if (opts.border) {
                    ctx.strokeStyle = opts.border;
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.roundRect(sx - w / 2, sy - h / 2, w, h, 4);
                    ctx.stroke();
                }
                ctx.fillStyle = opts.color || '#07080d';
                ctx.fillText(text, sx, sy + 0.5);
                ctx.restore();
            }

            function getRepeatingClubGradientColor(t, repeats = 6) {
                const cycle = ((t * repeats) % 1 + 1) % 1;
                // Pink (#FF3EB5: 255, 62, 181) -> Blue (#009CDE: 0, 156, 222) -> Yellow (#FEDD00: 254, 221, 0) -> Pink
                let r, g, b;
                if (cycle < 1 / 3) {
                    const u = cycle * 3;
                    r = Math.round(255 + (0 - 255) * u);
                    g = Math.round(62 + (156 - 62) * u);
                    b = Math.round(181 + (222 - 181) * u);
                } else if (cycle < 2 / 3) {
                    const u = (cycle - 1 / 3) * 3;
                    r = Math.round(0 + (254 - 0) * u);
                    g = Math.round(156 + (221 - 156) * u);
                    b = Math.round(222 + (0 - 222) * u);
                } else {
                    const u = (cycle - 2 / 3) * 3;
                    r = Math.round(254 + (255 - 254) * u);
                    g = Math.round(221 + (62 - 221) * u);
                    b = Math.round(0 + (181 - 0) * u);
                }
                return `rgb(${r}, ${g}, ${b})`;
            }

            /* ═══════════════════════════════════════════════════════════════════
               7. MAIN 60FPS RENDER LOOP
               ═══════════════════════════════════════════════════════════════════ */
            function render(now) {
                ctx.clearRect(0, 0, viewW, viewH);
                const isSmallScreen = window.innerWidth <= 640;

                // Continuous 3D spin in the selected spinDir when not actively dragging
                if (!isDragging) {
                    yaw += 0.0022 * spinDir;
                }

                // ── A. STENCIL BASE DISC (Dark Stencil Plate Floating Under the Trail) ──
                const projTrail = trailNodes.map((pt) => ({
                    ...pt,
                    ...project3D(pt.x, pt.y, pt.z),
                    base: project3D(pt.x, 0, pt.z)
                }));

                if (projTrail.length > 2) {
                    ctx.save();
                    ctx.beginPath();
                    projTrail.forEach((p, i) => {
                        if (i === 0) ctx.moveTo(p.base.sx, p.base.sy);
                        else ctx.lineTo(p.base.sx, p.base.sy);
                    });
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(7, 8, 13, 0.24)';
                    ctx.fill();
                    ctx.restore();
                }

                // Subtle architectural target rings centered on Capital Hill (Parliament House)
                if (landmarkNodes.parliament) {
                    const outerRingRad = 1.08;
                    [0.35, 0.72, outerRingRad].forEach((rad, idx) => {
                        ctx.save();
                        ctx.setLineDash([5, 6]);
                        ctx.beginPath();
                        for (let a = 0; a <= 60; a++) {
                            const theta = (a / 60) * Math.PI * 2;
                            const p = project3D(
                                landmarkNodes.parliament.x + Math.cos(theta) * rad,
                                0,
                                landmarkNodes.parliament.z + Math.sin(theta) * rad
                            );
                            if (a === 0) ctx.moveTo(p.sx, p.sy);
                            else ctx.lineTo(p.sx, p.sy);
                        }
                        ctx.strokeStyle = idx === 0
                            ? 'rgba(7, 8, 13, 0.28)'
                            : 'rgba(7, 8, 13, 0.20)';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();
                        ctx.restore();
                    });

                    // Curved stencil text "CANBERRA CENTENARY TRAIL" along the outer dashed circle
                    const trailArcText = 'CANBERRA CENTENARY TRAIL';
                    const textRad = outerRingRad + 0.045;
                    const baseTheta = -0.28; // Open East / North-East arc of the outer circle
                    const charStep = 0.044;
                    const eps = 0.015;

                    // Check screen left-to-right direction at the arc midpoint so text is never upside-down
                    const midA = project3D(
                        landmarkNodes.parliament.x + Math.cos(baseTheta - 0.1) * textRad,
                        0,
                        landmarkNodes.parliament.z + Math.sin(baseTheta - 0.1) * textRad
                    );
                    const midB = project3D(
                        landmarkNodes.parliament.x + Math.cos(baseTheta + 0.1) * textRad,
                        0,
                        landmarkNodes.parliament.z + Math.sin(baseTheta + 0.1) * textRad
                    );
                    const arcDir = midB.sx >= midA.sx ? 1 : -1;

                    ctx.save();
                    ctx.font = '700 9.5px "Syncopate", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = 'rgba(7, 8, 13, 0.68)';

                    for (let i = 0; i < trailArcText.length; i++) {
                        const offsetIdx = i - (trailArcText.length - 1) / 2;
                        const theta = baseTheta + offsetIdx * charStep * arcDir;

                        const p = project3D(
                            landmarkNodes.parliament.x + Math.cos(theta) * textRad,
                            0,
                            landmarkNodes.parliament.z + Math.sin(theta) * textRad
                        );
                        const pPrev = project3D(
                            landmarkNodes.parliament.x + Math.cos(theta - eps * arcDir) * textRad,
                            0,
                            landmarkNodes.parliament.z + Math.sin(theta - eps * arcDir) * textRad
                        );
                        const pNext = project3D(
                            landmarkNodes.parliament.x + Math.cos(theta + eps * arcDir) * textRad,
                            0,
                            landmarkNodes.parliament.z + Math.sin(theta + eps * arcDir) * textRad
                        );

                        const tangentAngle = Math.atan2(pNext.sy - pPrev.sy, pNext.sx - pPrev.sx);

                        ctx.save();
                        ctx.translate(p.sx, p.sy);
                        ctx.rotate(tangentAngle);
                        ctx.fillText(trailArcText[i], 0, 0);
                        ctx.restore();
                    }
                    ctx.restore();
                }

                // ── B. RIVERS & CANBERRA LAKES STENCIL (LAKE BURLEY GRIFFIN, GINNINDERRA, TUGGERANONG) ──
                riverCorridors.forEach((river) => {
                    drawProjectedPolyline(river, 'rgba(0, 240, 255, 0.45)', 2.5, [6, 4]);
                });

                drawProjectedPolygon(
                    ginninderraPolygon,
                    'rgba(0, 156, 222, 0.55)',
                    'rgba(7, 8, 13, 0.8)',
                    1.6
                );
                drawProjectedPolygon(
                    tuggeranongPolygon,
                    'rgba(0, 156, 222, 0.55)',
                    'rgba(7, 8, 13, 0.8)',
                    1.6
                );

                // Lake Burley Griffin (Centerpiece Stencil)
                drawProjectedPolygon(
                    lbgPolygon,
                    'rgba(0, 210, 255, 0.82)',
                    '#07080d',
                    2.4
                );

                // ── C. WALTER BURLEY GRIFFIN'S PARLIAMENTARY TRIANGLE & AVENUES STENCIL ──
                stencilAvenues.forEach((ave) => {
                    if (ave.major) {
                        drawProjectedPolyline(ave.nodes, '#07080d', 4.5);
                        drawProjectedPolyline(ave.nodes, '#FEDD00', 2.0);
                    } else {
                        drawProjectedPolyline(ave.nodes, 'rgba(7, 8, 13, 0.52)', 2.0, [4, 4]);
                    }
                });

                // State Circle, Capital Circle & City Hill stencil rings
                drawProjectedPolyline(stateCircleRing, '#07080d', 3.2);
                drawProjectedPolyline(stateCircleRing, '#FEDD00', 1.4);
                drawProjectedPolyline(capitalCircleRing, '#07080d', 2.2);
                drawProjectedPolyline(cityHillRing, '#07080d', 2.4);

                // ── D. ICONIC CANBERRA LANDMARK STENCILS (PARLIAMENT HOUSE, WAR MEMORIAL, TELSTRA TOWER, LBG) ──

                // 1. Parliament House 3D Stencil & Iconic Pyramidal Flagpole Mast on Capital Hill
                if (landmarkNodes.parliament) {
                    const phBase = project3D(landmarkNodes.parliament.x, 0, landmarkNodes.parliament.z);
                    const phTop = project3D(landmarkNodes.parliament.x, 0.14, landmarkNodes.parliament.z);
                    const legSpread = 12;

                    ctx.save();
                    ctx.strokeStyle = '#07080d';
                    ctx.lineWidth = 2.8;
                    ctx.beginPath();
                    ctx.moveTo(phBase.sx - legSpread, phBase.sy + 4);
                    ctx.lineTo(phTop.sx, phTop.sy);
                    ctx.lineTo(phBase.sx + legSpread, phBase.sy + 4);
                    ctx.moveTo(phBase.sx, phBase.sy + 7);
                    ctx.lineTo(phTop.sx, phTop.sy - 10);
                    ctx.stroke();

                    ctx.fillStyle = '#FEDD00';
                    ctx.strokeStyle = '#07080d';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.rect(phTop.sx, phTop.sy - 10, 9, 6);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                // 3. Australian War Memorial Stencil at top of ANZAC Parade
                if (landmarkNodes.warMemorial) {
                    const awmP = project3D(landmarkNodes.warMemorial.x, 0, landmarkNodes.warMemorial.z);
                    ctx.save();
                    ctx.fillStyle = '#FEDD00';
                    ctx.strokeStyle = '#07080d';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(awmP.sx, awmP.sy, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                // 4. Telstra Tower Stencil Spire on Black Mountain
                if (landmarkNodes.telstraTower) {
                    const ttBase = project3D(landmarkNodes.telstraTower.x, 0.18, landmarkNodes.telstraTower.z);
                    const ttTop = project3D(landmarkNodes.telstraTower.x, 0.36, landmarkNodes.telstraTower.z);
                    ctx.save();
                    ctx.strokeStyle = '#07080d';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(ttBase.sx, ttBase.sy);
                    ctx.lineTo(ttTop.sx, ttTop.sy);
                    ctx.stroke();
                    ctx.fillStyle = '#FEDD00';
                    ctx.beginPath();
                    ctx.ellipse(
                        (ttBase.sx + ttTop.sx) / 2,
                        (ttBase.sy + ttTop.sy) / 2,
                        6,
                        3,
                        0,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                // 5. AIS (Australian Institute of Sport) Running Track Oval & Stencil Badge in Bruce
                if (landmarkNodes.ais) {
                    const aisP = project3D(landmarkNodes.ais.x, 0, landmarkNodes.ais.z);
                    ctx.save();
                    // Running track stadium oval stencil
                    ctx.fillStyle = 'rgba(7, 8, 13, 0.85)';
                    ctx.strokeStyle = '#00f0ff';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.ellipse(aisP.sx, aisP.sy, 11, 6.5, -0.25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    // Inner track lane
                    ctx.strokeStyle = '#FEDD00';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.ellipse(aisP.sx, aisP.sy, 6.5, 3.5, -0.25, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // 6. Suburban Town Centre Stencil Watermarks (Civic, Belconnen, Gungahlin, Woden, Tuggeranong)
                ['civic', 'belconnen', 'gungahlin', 'woden', 'tuggeranong'].forEach((key) => {
                    const node = landmarkNodes[key];
                    if (!node) return;
                    const p = project3D(node.x, 0, node.z);
                    ctx.save();
                    ctx.font = '700 9px "Syncopate", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = 'rgba(7, 8, 13, 0.68)';
                    ctx.fillText(node.label, p.sx, p.sy);
                    ctx.restore();
                });

                // 7. Outbound Directional Stencil Arrows (GUMBY Course, Corin Dam, Mt Tennant, Blue Mountains, Mt Kosciuszko)
                if (!isSmallScreen) {
                    OUTBOUND_ARROWS.forEach((arr) => {
                        const rad = (arr.angleDeg * Math.PI) / 180;
                        const dirX = Math.cos(rad);
                        const dirZ = Math.sin(rad);
                        // Perpendicular vector in ground plane for arrowhead wings
                        const perpX = -dirZ;
                        const perpZ = dirX;

                        const sx0 = dirX * arr.rStart;
                        const sz0 = dirZ * arr.rStart;
                        const sx1 = dirX * arr.rEnd;
                        const sz1 = dirZ * arr.rEnd;

                        const headBaseR = arr.rEnd - 0.085;
                        const wingSpan = 0.055;
                        const wx1 = dirX * headBaseR + perpX * wingSpan;
                        const wz1 = dirZ * headBaseR + perpZ * wingSpan;
                        const wx2 = dirX * headBaseR - perpX * wingSpan;
                        const wz2 = dirZ * headBaseR - perpZ * wingSpan;

                        const pStart = project3D(sx0, 0, sz0);
                        const pTip = project3D(sx1, 0, sz1);
                        const pWing1 = project3D(wx1, 0, wz1);
                        const pWing2 = project3D(wx2, 0, wz2);

                        ctx.save();
                        // Black outer stencil casing for stem
                        ctx.strokeStyle = TAG_BLACK;
                        ctx.lineWidth = 6.5;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(pStart.sx, pStart.sy);
                        ctx.lineTo(headBaseR > arr.rStart ? project3D(dirX * headBaseR, 0, dirZ * headBaseR).sx : pTip.sx,
                                   headBaseR > arr.rStart ? project3D(dirX * headBaseR, 0, dirZ * headBaseR).sy : pTip.sy);
                        ctx.stroke();

                        // Grey/silver inner fill for stem
                        ctx.strokeStyle = TAG_SILVER_BG;
                        ctx.lineWidth = 3.4;
                        ctx.beginPath();
                        ctx.moveTo(pStart.sx, pStart.sy);
                        ctx.lineTo(headBaseR > arr.rStart ? project3D(dirX * headBaseR, 0, dirZ * headBaseR).sx : pTip.sx,
                                   headBaseR > arr.rStart ? project3D(dirX * headBaseR, 0, dirZ * headBaseR).sy : pTip.sy);
                        ctx.stroke();

                        // Arrowhead triangle with grey/silver fill and black border
                        ctx.fillStyle = TAG_SILVER_BG;
                        ctx.strokeStyle = TAG_BLACK;
                        ctx.lineWidth = 2.2;
                        ctx.beginPath();
                        ctx.moveTo(pTip.sx, pTip.sy);
                        ctx.lineTo(pWing1.sx, pWing1.sy);
                        ctx.lineTo(pWing2.sx, pWing2.sy);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        ctx.restore();

                        // Place boxed location tag just beyond the arrow tip
                        const pLabel = project3D(dirX * (arr.rEnd + 0.11), 0, dirZ * (arr.rEnd + 0.11));
                        const lx = Math.max(88, Math.min(viewW - 88, pLabel.sx));
                        const ly = Math.min(viewH - 18, pLabel.sy);

                        drawStencilPillLabel(
                            arr.label,
                            lx,
                            ly,
                            {
                                font: '700 8.5px "Audiowide", sans-serif',
                                bg: TAG_SILVER_BG,
                                border: TAG_BLACK,
                                color: TAG_BLACK,
                                height: 11,
                                padX: 6,
                                padY: 2.5
                            }
                        );
                    });
                }

                // ── E. 3D CANBERRA CENTENARY TRAIL ELEVATION CURTAIN & RIBBON ──
                if (projTrail.length > 2) {
                    ctx.save();
                    ctx.beginPath();
                    projTrail.forEach((p, i) => {
                        if (i === 0) ctx.moveTo(p.base.sx, p.base.sy);
                        else ctx.lineTo(p.base.sx, p.base.sy);
                    });
                    ctx.closePath();
                    ctx.strokeStyle = 'rgba(7, 8, 13, 0.45)';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    // Vertical topographic elevation struts connecting Canberra ground plane to the 3D trail
                    for (let i = 0; i < projTrail.length; i += 2) {
                        const p = projTrail[i];
                        ctx.beginPath();
                        ctx.moveTo(p.base.sx, p.base.sy);
                        ctx.lineTo(p.sx, p.sy);
                        ctx.strokeStyle = 'rgba(7, 8, 13, 0.32)';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }

                    // Bold Ink Outer Casing for the 3D Centenary Trail Ribbon
                    ctx.beginPath();
                    projTrail.forEach((p, i) => {
                        if (i === 0) ctx.moveTo(p.sx, p.sy);
                        else ctx.lineTo(p.sx, p.sy);
                    });
                    ctx.closePath();
                    ctx.strokeStyle = '#07080d';
                    ctx.lineWidth = 9.5;
                    ctx.lineJoin = 'round';
                    ctx.stroke();

                    // Dense repeating Pink -> Blue -> Yellow gradient along the 3D Centenary Trail
                    ctx.lineWidth = 4.5;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.shadowBlur = 0;
                    const totalPts = projTrail.length;
                    for (let i = 0; i < totalPts; i++) {
                        const p0 = projTrail[i];
                        const p1 = projTrail[(i + 1) % totalPts];
                        ctx.beginPath();
                        ctx.moveTo(p0.sx, p0.sy);
                        ctx.lineTo(p1.sx, p1.sy);
                        ctx.strokeStyle = getRepeatingClubGradientColor(i / totalPts, 6);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // ── F. LIVE GHOST RUNNER ORBITING THE CANBERRA CENTENARY TRAIL ──
                runner.progress = ((runner.progress + runner.speed * runnerDir) % 1 + 1) % 1;
                const rNode = sampleLoopNode(runner.progress);
                const rp = project3D(rNode.x, rNode.y + 0.025, rNode.z);

                ctx.save();
                for (let t = 1; t <= 6; t++) {
                    const trailNode = sampleLoopNode(runner.progress - t * 0.0055 * runnerDir);
                    const tp = project3D(trailNode.x, trailNode.y + 0.02, trailNode.z);
                    ctx.beginPath();
                    ctx.arc(tp.sx, tp.sy, Math.max(2, 7 - t), 0, Math.PI * 2);
                    ctx.fillStyle = runnerDir > 0 ? '#00f0ff' : '#FF3EB5';
                    ctx.globalAlpha = (7 - t) / 9;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                const runnerRad = 8.5;
                const runnerGrad = ctx.createLinearGradient(
                    rp.sx,
                    rp.sy - runnerRad,
                    rp.sx,
                    rp.sy + runnerRad
                );
                runnerGrad.addColorStop(0, '#FF3EB5');
                runnerGrad.addColorStop(1 / 3, '#FF3EB5');
                runnerGrad.addColorStop(1 / 3, '#FEDD00');
                runnerGrad.addColorStop(2 / 3, '#FEDD00');
                runnerGrad.addColorStop(2 / 3, '#009CDE');
                runnerGrad.addColorStop(1, '#009CDE');
                ctx.fillStyle = runnerGrad;
                ctx.beginPath();
                ctx.arc(rp.sx, rp.sy, runnerRad, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#07080d';
                ctx.stroke();
                ctx.restore();

                // ── G. LANDMARK CALLOUT TAGS SPACED OUTSIDE THE COURSE WITH THIN RED LINES (LARGE SCREENS) ──
                if (!isSmallScreen) {
                    LANDMARK_OUTER_CALLOUTS.forEach((item) => {
                        const targetNode = landmarkNodes[item.key];
                        if (!targetNode) return;

                        const pTarget = project3D(targetNode.x, item.yAnchor || 0, targetNode.z);
                        const rad = (item.angleDeg * Math.PI) / 180;
                        const pOuter = project3D(
                            Math.cos(rad) * item.radius,
                            0,
                            Math.sin(rad) * item.radius
                        );

                        const lx = Math.max(96, Math.min(viewW - 96, pOuter.sx));
                        const ly = Math.max(82, Math.min(viewH - 22, pOuter.sy));

                        // Thin red line connecting the outer tag back to its actual location
                        ctx.save();
                        ctx.strokeStyle = '#ff1e27';
                        ctx.lineWidth = 1.25;
                        ctx.beginPath();
                        ctx.moveTo(pTarget.sx, pTarget.sy);
                        ctx.lineTo(lx, ly);
                        ctx.stroke();

                        // Small red anchor dot at the exact landmark location
                        ctx.fillStyle = '#ff1e27';
                        ctx.beginPath();
                        ctx.arc(pTarget.sx, pTarget.sy, 2.6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();

                        drawStencilPillLabel(
                            item.text,
                            lx,
                            ly,
                            {
                                font: '700 8.5px "Audiowide", sans-serif',
                                bg: TAG_SILVER_BG,
                                border: TAG_BLACK,
                                color: TAG_BLACK,
                                height: 11,
                                padX: 6,
                                padY: 2.5
                            }
                        );
                    });
                }

                // ── H. POSITION THE 6 HIGH-POINT SUMMIT NAVIGATION PINS ──
                peakIndices.forEach((nodeIdx, k) => {
                    const node = projTrail[nodeIdx];
                    const pinEl = pinElements[k];
                    if (!node || !pinEl) return;

                    const meta = HIGH_POINT_TARGETS[k];
                    const markerRadius = isSmallScreen ? 4 : (6 + Math.sin(now * 0.004 + k) * 2);

                    // Draw summit vertical column & beacon dot on canvas
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(node.base.sx, node.base.sy);
                    ctx.lineTo(node.sx, node.sy);
                    ctx.strokeStyle = '#07080d';
                    ctx.lineWidth = 3.5;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(node.sx, node.sy, markerRadius, 0, Math.PI * 2);
                    ctx.fillStyle = isSmallScreen ? '#FF3EB5' : meta.color;
                    ctx.fill();
                    ctx.lineWidth = isSmallScreen ? 2 : 2.5;
                    ctx.strokeStyle = isSmallScreen ? '#FFFFFF' : '#07080d';
                    ctx.stroke();
                    ctx.restore();

                    if (isSmallScreen) {
                        pinEl.style.left = '';
                        pinEl.style.top = '';
                        pinEl.style.zIndex = '';
                        return;
                    }

                    // Allow summit pins to move freely in Y without being pushed by a header boundary
                    const padX = 72;
                    const clampedX = Math.max(padX, Math.min(viewW - padX, node.sx));
                    const clampedY = Math.min(viewH - 18, node.sy - 12);

                    pinEl.style.left = clampedX.toFixed(1) + 'px';
                    pinEl.style.top = clampedY.toFixed(1) + 'px';
                    pinEl.style.zIndex = String(Math.round(25 - node.depth * 5));
                });

                requestAnimationFrame(render);
            }

            requestAnimationFrame(render);
        })();
    </script>
</body>
